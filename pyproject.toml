[project]
name = "warmpath"
version = "0.2.0"
description = "Score your own LinkedIn network and find warm paths into the company you just applied to."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.60"]
discover = ["exa-py>=1.0"]
all = ["anthropic>=0.60", "exa-py>=1.0"]

[project.scripts]
warmpath = "warmpath.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["warmpath*"]
